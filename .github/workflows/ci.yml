name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Release signing + backend URL come from repo secrets; both are gitignored locally.
      - name: Write signing + env files
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          JARVIS_URL: ${{ secrets.JARVIS_URL }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          printf '{"JARVIS_URL": "%s"}\n' "$JARVIS_URL" > jarvis.env.json
          [ -z "$GOOGLE_SERVICES_B64" ] || echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
          # Fail fast (seconds, not after the Gradle build) when a signing secret is missing or mangled.
          [ -n "$KEY_ALIAS" ] || { echo "::error::ANDROID_KEY_ALIAS secret is empty"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::keystore unreadable: re-check ANDROID_KEYSTORE_B64, _PASSWORD and _KEY_ALIAS"; exit 1; }

      - run: flutter build apk --release --dart-define-from-file=jarvis.env.json
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis_app/build/app/outputs/flutter-apk/app-release.apk
