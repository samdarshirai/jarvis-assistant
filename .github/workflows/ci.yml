name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  app:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}  # only to gate the Play step; secrets aren't readable in `if`
    defaults:
      run:
        working-directory: jarvis_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Release signing + backend URL come from repo secrets; both are gitignored locally.
      - name: Write signing + env files
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          JARVIS_URL: ${{ secrets.JARVIS_URL }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          printf '{"JARVIS_URL": "%s"}\n' "$JARVIS_URL" > jarvis.env.json
          [ -z "$GOOGLE_SERVICES_B64" ] || echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
          # Fail fast (seconds, not after the Gradle build) when a signing secret is missing or mangled.
          [ -n "$JARVIS_URL" ] || { echo "::error::JARVIS_URL secret is empty: the app would have no backend"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::ANDROID_KEY_ALIAS secret is empty"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::keystore unreadable: re-check ANDROID_KEYSTORE_B64, _PASSWORD and _KEY_ALIAS"; exit 1; }

      - run: flutter build apk --release --dart-define-from-file=jarvis.env.json --build-number=${{ github.run_number }}
      # Play wants a bundle, not an APK. Same signing, same build number.
      - if: env.PLAY_JSON != ''
        run: flutter build appbundle --release --dart-define-from-file=jarvis.env.json --build-number=${{ github.run_number }}

      - name: Upload to Play (internal track)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.samdarshi.jarvis
          releaseFiles: jarvis_app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis_app/build/app/outputs/flutter-apk/app-release.apk

      # Every green main build becomes a release; the run number is the Android versionCode, so each installs as an update.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk jarvis-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" "jarvis-${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }}" --notes "${{ github.sha }}" --target "${{ github.sha }}"
