# Production stack: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env  # JARVIS_DATABASE_URL = Railway Postgres URL
    ports: ["${PORT:-8000}:8000"]  # Railway VM preview URL; unused behind caddy
    # optional FCM key: put it in ./secrets/fcm.json and set JARVIS_FCM_CREDENTIALS_PATH=/secrets/fcm.json in .env
    volumes: ["./secrets:/secrets:ro"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
